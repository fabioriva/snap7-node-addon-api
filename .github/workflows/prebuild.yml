name: Build prebuilt binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci

      - name: Build native addon on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          npm_config_msvs_version: 2022
          GYP_MSVS_VERSION: 2022
        run: |
          set
          npm run build

      - name: Build native addon on Linux
        if: runner.os == 'Linux'
        run: npm run build

      - name: Create prebuilt binaries
        run: npx prebuildify --strip --napi

      - name: Upload prebuild artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ runner.os }}
          path: prebuilds/**
          if-no-files-found: error

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
